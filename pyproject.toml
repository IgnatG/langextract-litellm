[build-system]
requires = ["setuptools>=82.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langextract-litellm"
version = "0.2.0"
description = "LangExtract provider plugin for LiteLLM"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "langextract @ git+https://github.com/IgnatG/langextract.git@develop",
    "litellm>=1.81.13",
]

[project.entry-points."langextract.providers"]
litellm = "langextract_litellm.provider:LiteLLMLanguageModel"

[tool.setuptools.packages.find]
where = ["."]
include = ["langextract_litellm*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
